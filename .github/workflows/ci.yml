name: Peaks CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: peaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            architecture: x64
            artifact: Peaks-windows-x64
          - platform: macos
            runner: macos-14
            architecture: arm64
            artifact: Peaks-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.7'
          enable-cache: true

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --dev --locked

      - name: Validate Python
        run: |
          uv run ruff check .
          uv run mypy src
          uv run pytest

      - name: Validate Electron and renderer
        run: |
          npm run lint
          npm test
          npm run build:web

      - name: Build and smoke-test frozen backend and browser
        run: npm run build:runtime

      # Signing is optional until a release certificate is configured. Never
      # publish from CI or pass a repository token into Electron Builder.
      - name: Package Windows NSIS update
        if: matrix.platform == 'windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node node_modules/electron-builder/out/cli/cli.js --win nsis --x64 --publish never

      - name: Package macOS application
        if: matrix.platform == 'macos'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node node_modules/electron-builder/out/cli/cli.js --mac dmg zip --arm64 --publish never

      - name: Smoke-test packaged Electron application
        run: uv run python scripts/smoke_electron.py

      - name: Verify Windows update metadata and checksums
        if: matrix.platform == 'windows'
        run: uv run python scripts/verify_update_artifacts.py release/electron

      - name: Hash macOS artifacts
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd release/electron
          shasum -a 256 ./*.dmg ./*.zip ./latest-mac.yml > SHA256SUMS.txt

      - name: Upload Windows update artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/electron/*.exe
            release/electron/*.exe.blockmap
            release/electron/latest.yml
            release/electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/latest-mac.yml
            release/electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
