[project]
name = "peaks-desktop"
version = "0.4.0"
description = "Electron and React desktop companion with secure Python Riot integrations."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Peaks contributors" }]
dependencies = [
  "cryptography==50.0.1",
  "keyring==25.7.0",
  "patchright==1.62.3",
  "platformdirs==4.11.10",
  "psutil==7.2.2",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "zxing-cpp==3.1.1",
]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-qt==4.5.0",
  # Temporary compatibility dependency for the legacy controller regression
  # suite while integrations finish migrating to the JSON service boundary.
  "pyside6==6.11.2",
  "ruff==0.16.8",
  "types-requests==2.33.0.20260906",
]

[project.scripts]
peaks = "peaks.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peaks"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
